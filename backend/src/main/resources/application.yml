server:
  port: 8080

spring:
  application:
    name: tech-store-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tech_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:tech_store_local}
    password: ${DB_PASSWORD:CHANGE_ME_LOCALLY}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:586e3272357538782f413f4428472b4b6250645367566b597033733676397924}
    expiration-ms: 86400000 # 24 hours (86,400,000 ms)
  demo:
    enabled: true
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@123}
    staff-password: ${DEMO_STAFF_PASSWORD:Staff@123}
    customer-password: ${DEMO_CUSTOMER_PASSWORD:Customer@123}
